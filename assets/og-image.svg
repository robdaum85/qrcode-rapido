<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fbfc"/>
      <stop offset="0.55" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eaf1f6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#10233f" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="110" cy="80" r="210" fill="#72d9dd" opacity=".13"/>
  <circle cx="1120" cy="600" r="250" fill="#1769e0" opacity=".08"/>

  <g transform="translate(82 80)">
