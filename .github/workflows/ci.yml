name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testar e preparar deploy
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências de desenvolvimento
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Preparar pasta publicável
        run: npm run build

      - name: Guardar artefato do deploy
        uses: actions/upload-artifact@v4
        with:
          name: qrcode-rapido-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
